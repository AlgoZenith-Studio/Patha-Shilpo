name: pathashilpa
description: Offline-first, voice-guided cataloguing and fair-pricing platform for rural Indian artisans.
publish_to: 'none'
version: 1.0.0+2009

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  # Offline store
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Capture & media
  image_picker: ^1.1.2
  image: ^4.2.0                # decode, crop, pad, compress
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  # Plays the WAV bytes returned by POST /api/v1/ai/tts. flutter_tts only
  # speaks text it synthesises itself, so the online (Sarvam/Bhashini) tier
  # cannot use it for playback.
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1

  # Networking & platform
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  uuid: ^4.5.1
  intl: ^0.20.2                # compatible with flutter_localizations in current Flutter SDK
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1       # loads .env (BACKEND_URL) - see core/config/env.dart
  # v6 API: GoogleSignIn() + .signIn() as used in data/remote/auth_service.dart.
  # v7 removed both - do not bump without rewriting that file.
  google_sign_in: ^6.2.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true               # enables gen_l10n

  assets:
    - assets/
    - assets/data/
    - .env

  # NOTE: fonts live under assets/data/ alongside medians.json, matching the
  # existing on-disk layout. All three families are Latin-only â€” every TextStyle
  # must declare fontFamilyFallback to the system Noto faces. See TRD.md Â§10.1.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/data/Lora-SemiBold.otf
          weight: 600
        - asset: assets/data/Lora-Bold.otf
          weight: 700

    - family: Pally
      fonts:
        - asset: assets/data/Pally-Regular.otf
          weight: 400
        - asset: assets/data/Pally-Bold.otf
          weight: 700

    - family: Rowan
      fonts:
        - asset: assets/data/Rowan-Medium.otf
          weight: 500
        - asset: assets/data/Rowan-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/data/Rowan-SemiboldItalic.otf
          weight: 600
          style: italic
